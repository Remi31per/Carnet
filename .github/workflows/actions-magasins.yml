name: Télécharger les actions des magasins
# Chaque lundi et jeudi, télécharge les pages d'actions de rappn.ch (Migros, Lidl, Aldi, Denner),
# pour le canton de Vaud (Payerne, Avenches ; Lidl, Aldi et Denner sont identiques à Fribourg), dans data/raw/,
# puis les résume dans data/raw/actions-brutes.json pour la tâche Claude « Actions Carnet ».
on:
  schedule:
    - cron: "15 6 * * 1,4"   # lundi et jeudi, 7 h 15 en hiver (8 h 15 en été)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les pages
        run: |
          mkdir -p data/raw
          rm -f data/raw/rappn-*.html
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          for k in VD; do   # le site ne publie la liste détaillée en ligne que pour Vaud (Fribourg : seulement dans son app)
            for s in migros lidl-suisse aldi-suisse denner; do
              curl -sSL --compressed -A "$UA" -H "Accept-Language: fr-CH,fr;q=0.9" \
                "https://rappn.ch/fr/actions/$s?kanton=$k" -o "data/raw/rappn-$s-$k.html" || echo "échec $s $k"
              echo "$s $k : $(wc -c < data/raw/rappn-$s-$k.html) octets"
              sleep 2
            done
          done
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/raw/telecharge-le.txt
          python3 scripts/extraire_actions.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "Robot actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/raw
          git commit -m "Pages d'actions téléchargées ($(date +%d.%m))" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
